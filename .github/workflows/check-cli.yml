name: Check - cli

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/cli/**"
      - "packages/authoring/**"
      - "packages/catalog/**"
      - "packages/domain/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/cli/**"
      - "packages/authoring/**"
      - "packages/catalog/**"
      - "packages/domain/**"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Lint
        run: bun lint

  verify-types:
    name: "Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Verify Types
        run: bun run type-check --filter=stack-effect --filter=@repo/authoring

  formatting:
    name: "Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Check Formatting
        run: bun format:check

  test:
    name: "Unit Test"
    needs:
      - lint
      - verify-types
      - formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run test --filter=stack-effect --filter=@repo/authoring

      - name: Build
        run: bun run build --filter=stack-effect

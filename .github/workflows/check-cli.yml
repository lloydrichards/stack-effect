name: Check - cli

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/cli/**"
      - "catalogs/**"
      - "packages/**"
      - ".github/workflows/check-cli.yml"
      - ".oxfmtrc.jsonc"
      - ".oxlintrc.json"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
  pull_request:
    branches:
      - main
    paths:
      - "apps/cli/**"
      - "catalogs/**"
      - "packages/**"
      - ".github/workflows/check-cli.yml"
      - ".oxfmtrc.jsonc"
      - ".oxlintrc.json"
      - "bun.lock"
      - "package.json"
      - "turbo.json"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Lint
        run: bun lint

  verify-types:
    name: "Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Verify Types
        run: bun run type-check --filter=stack-effect --filter=@repo/authoring --filter=@stack-effect/author

  formatting:
    name: "Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Check Formatting
        run: bun format:check

  test:
    name: "Unit Test"
    needs:
      - lint
      - verify-types
      - formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run test --filter=stack-effect --filter=@repo/authoring

      - name: Build
        run: bun run build --filter=stack-effect

  package:
    name: "Author Package"
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/setup

      # The smoke project runs the packed package under plain Node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Verify Clean Install
        run: bun run --cwd packages/author verify:package

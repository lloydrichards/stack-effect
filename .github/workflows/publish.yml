name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run type-check
      - run: bun run lint
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run build

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm --version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          # Required as an input for release tags and notes in v2.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # npm authenticates through trusted publishing (OIDC, id-token: write);
          # there is no NPM_TOKEN. Each package needs a trusted publisher on npm.
          publish-script: npx changeset publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

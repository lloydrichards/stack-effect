name: Check - docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "apps/cli/**"
      - "packages/catalog/**"
      - "packages/domain/**"
      - "packages/scaffold/**"
      - "packages/config-typescript/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
  pull_request:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "apps/cli/**"
      - "packages/catalog/**"
      - "packages/domain/**"
      - "packages/scaffold/**"
      - "packages/config-typescript/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun lint

  verify-types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/docs type-check

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun format:check

  test-and-build:
    name: Test and build
    needs:
      - lint
      - verify-types
      - formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd apps/docs test
      - run: bun run --cwd apps/docs build

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stack_effect
      POSTGRES_USER: stack_effect
      POSTGRES_PASSWORD: stack_effect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack_effect -d stack_effect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
